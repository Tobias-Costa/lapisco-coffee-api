services:
  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    env_file:
      - .env
    # Testa se o DB está estabilizado e aceitando conexões antes de conectar à API
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 5

  coffee_api:
    build: .
    restart: unless-stopped
    ports:
      - "8001:8000"
    depends_on:
      db:
        # Garante que a API só ligue após o healthcheck do banco passar
        condition: service_healthy 

    volumes:
      - .:/app
    env_file:
      - .env
      
volumes:
  pg_data:
